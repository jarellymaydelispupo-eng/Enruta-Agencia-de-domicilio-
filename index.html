<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Pedidos EnRuta</title>
<style>
body{
font-family: Arial;
background:#f5f5f5;
padding:20px;
}.container{
background:white;
padding:20px;
border-radius:10px;
max-width:500px;
margin:auto;
}

input,button{
width:100%;
padding:10px;
margin:5px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#00b894;
color:white;
font-size:16px;
}

</style>
</head><body><div class="container"><h2>Nuevo Pedido EnRuta</h2><input id="cliente" placeholder="Nombre del cliente">
<input id="telefono" placeholder="Teléfono">
<input id="zona" placeholder="Zona"><input id="recoger" placeholder="Dirección de recogida">
<input id="entregar" placeholder="Dirección de entrega"><input id="paquete" placeholder="Tipo de paquete"><input id="precioCliente" placeholder="Precio cliente">
<input id="pagoMensajero" placeholder="Pago mensajero"><button onclick="enviar()">Registrar Pedido</button>

</div><script>

function enviar(){

let data={
cliente:document.getElementById("cliente").value,
telefono:document.getElementById("telefono").value,
zona:document.getElementById("zona").value,
recoger:document.getElementById("recoger").value,
entregar:document.getElementById("entregar").value,
paquete:document.getElementById("paquete").value,
precioCliente:document.getElementById("precioCliente").value,
pagoMensajero:document.getElementById("pagoMensajero").value,
ganancia:document.getElementById("precioCliente").value - document.getElementById("pagoMensajero").value
};

fetch("https://script.google.com/macros/s/AKfycbzhGvtN0k8_3RhEEn-nrabG8Nfq3Egc8z8R_SkbAug0pG4HK3D2veF3MIjzG9GnxFjHCg/exec",{
method:"POST",
body:JSON.stringify(data)
})
.then(res=>res.text())
.then(res=>{
alert("Pedido registrado");
});

}

</script></body>
</html>
