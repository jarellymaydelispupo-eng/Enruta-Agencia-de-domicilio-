<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hola EnRuta - Pedir Mensajero</title>

<style>

body{
font-family: Arial;
margin:0;
background: linear-gradient(135deg,#ff4d6d,#ff758f);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
background:white;
padding:30px;
border-radius:15px;
width:90%;
max-width:500px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
text-align:center;
color:#ff4d6d;
}

img{
width:120px;
display:block;
margin:auto;
border-radius:50%;
}

label{
font-weight:bold;
margin-top:10px;
display:block;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:15px;
background:#ff4d6d;
color:white;
border:none;
border-radius:10px;
font-size:16px;
margin-top:20px;
cursor:pointer;
}

button:hover{
background:#ff2f58;
}

.precio{
text-align:center;
margin-top:10px;
font-size:18px;
font-weight:bold;
color:#333;
}

</style>
</head>

<body>

<div class="container">

<img src="https://cdn-icons-png.flaticon.com/512/3202/3202926.png">

<h1>Hola EnRuta</h1>

<label>Nombre</label>
<input type="text" id="nombre">

<label>Dirección de recogida</label>
<input type="text" id="recogida">

<label>Dirección de entrega</label>
<input type="text" id="entrega">

<label>Tipo de servicio</label>
<select id="servicio" onchange="mostrarCobro()">
<option value="llevar">Llevar algo</option>
<option value="cobrar">Entrega + Cobro</option>
</select>

<div id="campoCobro" style="display:none;">

<label>Monto a cobrar al cliente</label>
<input type="number" id="cobro">

</div>

<label>Importe del viaje</label>
<input type="number" id="importe">

<div class="precio" id="precio">
Precio del servicio: 250 CUP
</div>

<button onclick="pedir()">Pedir Mensajero</button>

</div>

<script>

function mostrarCobro(){

let servicio=document.getElementById("servicio").value
let campo=document.getElementById("campoCobro")
let precio=document.getElementById("precio")

if(servicio=="cobrar"){

campo.style.display="block"
precio.innerHTML="Precio del servicio: 350 CUP"

}else{

campo.style.display="none"
precio.innerHTML="Precio del servicio: 250 CUP"

}

}

function pedir(){

let nombre=document.getElementById("nombre").value
let recogida=document.getElementById("recogida").value
let entrega=document.getElementById("entrega").value
let servicio=document.getElementById("servicio").value
let cobro=document.getElementById("cobro").value
let importe=document.getElementById("importe").value

let texto="Hola EnRuta deseo un domicilio%0A%0A"

texto+="Nombre: "+nombre+"%0A"
texto+="Recoger en: "+recogida+"%0A"
texto+="Entregar en: "+entrega+"%0A"

if(servicio=="llevar"){
texto+="Servicio: Llevar algo%0A"
}

if(servicio=="cobrar"){
texto+="Servicio: Entrega + Cobro%0A"
texto+="Monto a cobrar al cliente: "+cobro+" CUP%0A"
}

texto+="Importe del viaje: "+importe+" CUP"

window.open("https://wa.me/5350000000?text="+texto)

}

</script>

</body>
</html>
