<input id="entrega" placeholder="Dirección de entrega">

<script>

function calcular(){

let datos=document.getElementById("zona").value.split("|");

let zona=datos[0];
let cliente=parseInt(datos[1]);
let mensajero=parseInt(datos[2]);

let ganancia=cliente-mensajero;

document.getElementById("precio").innerHTML="Precio del viaje: $"+cliente;

document.getElementById("mensajero").innerHTML="Pago al mensajero: $"+mensajero;

document.getElementById("ganancia").innerHTML="Ganancia EnRuta: $"+ganancia;

}

function enviar(){

let zona=document.getElementById("zona").value.split("|")[0];
let precio=document.getElementById("precio").innerText;
let nombre=document.getElementById("nombre").value;
let telefono=document.getElementById("telefono").value;
let direccion=document.getElementById("direccion").value;
let entrega=document.getElementById("entrega").value;
let pedido=document.getElementById("pedido").value;

let mensaje="🚚 DOMICILIO ENRUTA\n\n"+
"Zona: "+zona+"\n"+
precio+"\n\n"+
"Nombre: "+nombre+"\n"+
"Teléfono: "+telefono+"\n"+
"Recoger en: "+direccion+"\n"+
"Entregar en: "+entrega+"\n"+
"Paquete: "+pedido;

let url="https://wa.me/?text="+encodeURIComponent(mensaje);

window.open(url);

}

</script>
