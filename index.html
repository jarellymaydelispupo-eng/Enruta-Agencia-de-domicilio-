<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnRuta Delivery | Servicio Profesional</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        
        body { font-family: 'Poppins', sans-serif; margin:0; background:#f4f7f6; padding: 20px; display:flex; justify-content:center; }
        .container { background:white; width:100%; max-width:450px; padding:30px; border-radius:25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header img { width: 120px; margin-bottom: 10px; }
        .header h1 { font-size: 24px; color: #333; margin: 0; }
        .header p { color: #888; font-size: 14px; }

        .steps { display: flex; justify-content: space-around; margin-bottom: 25px; font-size: 12px; color: #666; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; display: block; }
        select, input, textarea { width:100%; padding:14px; border: 2px solid #eee; border-radius:12px; font-size:15px; transition: 0.3s; box-sizing: border-box; }
        select:focus, input:focus { border-color: #1e90ff; outline: none; }
        
        .precio-box { background: #e8f4ff; color: #1e90ff; padding: 15px; border-radius: 12px; text-align: center; font-size: 20px; font-weight: 700; margin: 20px 0; }
        
        button { background: linear-gradient(45deg, #1e90ff, #00c6ff); color:white; border:none; padding:18px; width:100%; font-size:17px; border-radius:12px; cursor:pointer; font-weight: 600; box-shadow: 0 5px 15px rgba(30,144,255,0.3); }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="1772931732602.png" alt="Logo">
        <h1>EnRuta Delivery</h1>
        <p>Tu pedido, directo a tu puerta.</p>
    </div>

    <div class="steps">
        <span>📍 Ubica</span>
        <span>📦 Detalla</span>
        <span>🚀 Recibe</span>
    </div>

    <div class="form-group">
        <label>¿A dónde vamos?</label>
        <select id="zona" onchange="calcular()">
            <option value="0">Seleccionar destino...</option>
            <option value="300">Centro del pueblo - $300</option>
            <option value="500">Lenin - $500</option>
            </select>
    </div>

    <div class="precio-box" id="precio">Total: $0</div>

    <div class="form-group">
        <input type="text" id="nombre" placeholder="Nombre completo">
    </div>
    <div class="form-group">
        <input type="tel" id="telefono" placeholder="WhatsApp / Teléfono">
    </div>
    <div class="form-group">
        <textarea id="pedido" placeholder="¿Qué vamos a enviar?" rows="2"></textarea>
    </div>

    <button onclick="enviar()">Solicitar Envío</button>
</div>

<script>
    function calcular(){
        let total = parseInt(document.getElementById("zona").value);
        document.getElementById("precio").innerHTML = "Total: $" + total.toLocaleString();
        return total;
    }

    function enviar(){
        let total = calcular();
        let zonaTxt = document.getElementById("zona").options[document.getElementById("zona").selectedIndex].text;
        let msg = `*NUEVO PEDIDO*%0A*Zona:* ${zonaTxt}%0A*Total:* $${total}%0A*Cliente:* ${document.getElementById("nombre").value}%0A*Tel:* ${document.getElementById("telefono").value}%0A*Detalles:* ${document.getElementById("pedido").value}`;
        window.open(`https://wa.me/5356746691?text=${msg}`, '_blank');
    }
</script>
</body>
    </html>
