<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Enruta - Agencia de Domicilios</title>

<style>

body{
font-family:Arial;
background:#f4f6f8;
text-align:center;
padding:20px;
}

.logo{
width:200px;
margin-bottom:10px;
}

.container{
background:white;
padding:20px;
border-radius:10px;
max-width:420px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

select,input{
width:90%;
padding:10px;
margin:6px;
border-radius:6px;
border:1px solid #ccc;
}

button{
background:#1a73e8;
color:white;
border:none;
padding:12px;
width:95%;
border-radius:6px;
margin-top:10px;
font-size:16px;
}

.resultado{
margin-top:15px;
font-size:18px;
}

.lista{
margin-top:20px;
text-align:left;
}

</style>
</head>

<body>

<img src="1772931732602.png" class="logo">

<h1>Enruta</h1>
<h3>Agencia de Mensajería</h3>

<div class="container">

<h3>Nuevo domicilio</h3>

<select id="vehiculo" onchange="ponerPrecio()">

<option value="">Tipo de envío</option>

<option value="motorina">Motorina</option>

<option value="carrito">Carrito</option>

<option value="viaje">Viaje largo</option>

</select>

<input id="cliente" placeholder="Cobro al cliente">

<input id="mensajero" placeholder="Pago al mensajero">

<button onclick="calcular()">Calcular ganancia</button>

<div class="resultado" id="resultado"></div>

<button onclick="guardar()">Guardar domicilio</button>

<button onclick="enviar()">Enviar por WhatsApp</button>

<div class="lista">

<h3>Domicilios del día</h3>

<div id="lista"></div>

</div>

</div>

<script>

let contador=0;

function ponerPrecio(){

let tipo=document.getElementById("vehiculo").value;

if(tipo=="motorina"){

document.getElementById("cliente").value=250;
document.getElementById("mensajero").value=200;

}

if(tipo=="carrito"){

document.getElementById("cliente").value=350;
document.getElementById("mensajero").value=280;

}

if(tipo=="viaje"){

document.getElementById("cliente").value=500;
document.getElementById("mensajero").value=400;

}

}

function calcular(){

let cliente=Number(document.getElementById("cliente").value);
let mensajero=Number(document.getElementById("mensajero").value);

let ganancia=cliente-mensajero;

document.getElementById("resultado").innerHTML=

"Cobro al cliente: $"+cliente+

"<br>Pago al mensajero: $"+mensajero+

"<br><b>Ganancia tuya: $"+ganancia+"</b>";

}

function guardar(){

contador++;

let cliente=document.getElementById("cliente").value;
let mensajero=document.getElementById("mensajero").value;
let tipo=document.getElementById("vehiculo").value;

let ganancia=cliente-mensajero;

let texto=

"Domicilio #"+contador+

" | "+tipo+

" | Cliente $"+cliente+

" | Mensajero $"+mensajero+

" | Ganancia $"+ganancia;

document.getElementById("lista").innerHTML+="<p>"+texto+"</p>";

}

function enviar(){

let cliente=document.getElementById("cliente").value;
let mensajero=document.getElementById("mensajero").value;
let tipo=document.getElementById("vehiculo").value;

let mensaje=

"Domicilio Enruta%0A"+

"Tipo: "+tipo+"%0A"+

"Cobro al cliente: $"+cliente+"%0A"+

"Pago al mensajero: $"+mensajero;

window.open("https://wa.me/?text="+mensaje);

}

</script>

</body>
  </html>
