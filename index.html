<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnRuta - Agencia de Domicilios</title>

<style>

body{
font-family: Arial, sans-serif;
background:#f4f4f4;
margin:0;
padding:0;
text-align:center;
}

header{
background:#0a3d62;
color:white;
padding:20px;
}

.logo{
width:200px;
margin-top:10px;
}

.container{
background:white;
margin:20px;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

input, textarea, select{
width:90%;
padding:10px;
margin:10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#27ae60;
color:white;
padding:12px;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
width:95%;
}

button:hover{
background:#219150;
}

</style>
</head>

<body>

<header>

<img src="1772931732602.png" class="logo">

<h1>EnRuta</h1>
<p>Agencia de domicilios</p>

</header>

<div class="container">

<h2>Solicitar domicilio</h2>

<input type="text" id="nombre" placeholder="Tu nombre">

<input type="text" id="telefono" placeholder="Tu teléfono">

<textarea id="direccion" placeholder="Escribe tu dirección con todos los detalles (barrio, casa, color de la casa, referencias, etc)"></textarea>

<input type="text" id="pedido" placeholder="¿Qué deseas pedir?">

<select id="zona">

<option value="Centro">Centro</option>
<option value="Norte">Zona Norte</option>
<option value="Sur">Zona Sur</option>
<option value="Este">Zona Este</option>
<option value="Oeste">Zona Oeste</option>

</select>

<button onclick="enviarPedido()">Enviar pedido por WhatsApp</button>

</div>

<script>

function enviarPedido(){

var nombre=document.getElementById("nombre").value;
var telefono=document.getElementById("telefono").value;
var direccion=document.getElementById("direccion").value;
var pedido=document.getElementById("pedido").value;
var zona=document.getElementById("zona").value;

var mensaje="Nuevo pedido%0A%0A"+
"Nombre: "+nombre+"%0A"+
"Teléfono: "+telefono+"%0A"+
"Dirección: "+direccion+"%0A"+
"Pedido: "+pedido+"%0A"+
"Zona: "+zona;

window.open("https://wa.me/56746691?text="+mensaje);

}

</script>

</body>
  </html>
