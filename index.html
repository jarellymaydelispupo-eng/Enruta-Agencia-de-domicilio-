<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnRuta Delivery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background:#f4f7f6; padding: 20px; display:flex; justify-content:center; }
        .container { background:white; width:100%; max-width:450px; padding:30px; border-radius:25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        .header img { width: 220px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        select, input, textarea { width:100%; padding:14px; border: 2px solid #eee; border-radius:12px; font-size:15px; box-sizing: border-box; }
        .precio-box { background: #e8f4ff; color: #1e90ff; padding: 15px; border-radius: 12px; text-align: center; font-size: 20px; font-weight: 700; margin: 20px 0; }
        button { background: linear-gradient(45deg, #1e90ff, #00c6ff); color:white; border:none; padding:18px; width:100%; font-size:17px; border-radius:12px; cursor:pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="1772931732602.png" alt="Logo">
        <h2>EnRuta Delivery</h2>
    </div>

    <div class="form-group">
        <label>Vehículo</label>
        <select id="vehiculo" onchange="actualizarZonas()">
            <option value="motorina">Motorina (Zonas locales)</option>
            <option value="carrito">Carrito Eléctrico (Viajes largos)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Zona de entrega</label>
        <select id="zona" onchange="calcular()">
            <option value="0">Seleccionar destino...</option>
        </select>
    </div>

    <div class="precio-box" id="precio">Total: $0</div>

    <div class="form-group">
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="tel" id="telefono" placeholder="Teléfono" style="margin-top:10px;">
        <input type="text" id="recoger" placeholder="Dirección de recogida" style="margin-top:10px;">
        <input type="text" id="entregar" placeholder="Dirección de entrega" style="margin-top:10px;">
        <input type="time" id="hora" style="margin-top:10px;">
        <textarea id="pedido" placeholder="¿Qué vamos a enviar?" rows="2" style="margin-top:10px;"></textarea>
    </div>

    <button onclick="enviar()">Solicitar Envío</button>
    
    <div style="margin-top: 30px; text-align: center;">
        <button onclick="accederAdmin()" style="background:#555; padding:10px; font-size:12px; width: auto;">Panel Admin</button>
    </div>
</div>

<script>
const zonasMotorina = [
    {val: 300, txt: "Centro del pueblo - $300"}, {val: 350, txt: "La Caridad - $350"}, {val: 400, txt: "Modelo - $400"},
    {val: 400, txt: "La Vigía - $400"}, {val: 400, txt: "Florat - $400"}, {val: 350, txt: "Vista Hermosa - $350"},
    {val: 400, txt: "Versalles - $400"}, {val: 350, txt: "Agramonte - $350"}, {val: 500, txt: "Jayama - $500"},
    {val: 400, txt: "Monte Carlos - $400"}, {val: 400, txt: "La Mosca - $400"}, {val: 400, txt: "Marquesado - $400"},
    {val: 450, txt: "La Esperanza - $450"}, {val: 450, txt: "Nueva Esperanza - $450"}, {val: 400, txt: "Garrido - $400"},
    {val: 450, txt: "El Micro - $450"}, {val: 400, txt: "Palomino - $400"}, {val: 400, txt: "Juanito - $400"},
    {val: 350, txt: "Previsora - $350"}, {val: 450, txt: "La Guernina - $450"}, {val: 450, txt: "La Belén - $450"},
    {val: 350, txt: "Casino Campestre - $350"}, {val: 350, txt: "Las Mercedes - $350"}, {val: 350, txt: "Simoni - $350"},
    {val: 400, txt: "Montejo - $400"}, {val: 450, txt: "La Yaba - $450"}, {val: 450, txt: "Nadales - $450"},
    {val: 400, txt: "Bella Vista - $400"}, {val: 450, txt: "Vista Bella - $450"}, {val: 400, txt: "Inra - $400"},
    {val: 450, txt: "Imán - $450"}, {val: 400, txt: "Mascota - $400"}, {val: 400, txt: "Puerto Príncipe - $400"},
    {val: 500, txt: "Isabel Hortensia - $500"}, {val: 400, txt: "Villa Mariana - $400"}, {val: 450, txt: "Los Coquitos - $450"},
    {val: 450, txt: "La Zambrana - $450"}, {val: 500, txt: "Saratoga - $500"}, {val: 400, txt: "El Jardín - $400"},
    {val: 350, txt: "Floiran Quiroz - $350"}, {val: 350, txt: "Porvenir - $350"}, {val: 450, txt: "Nitrógeno - $450"},
    {val: 400, txt: "Buenos Aires - $400"}, {val: 400, txt: "Camino de la Matanza - $400"}, {val: 350, txt: "Sanchez Soto - $350"},
    {val: 5000, txt: "Florida - $5,000"}, {val: 5500, txt: "Vertientes - $5,500"}, {val: 4500, txt: "Jimaguayu - $4,500"}
];

const zonasCarrito = [
    {val: 12000, txt: "Minas - $12,000"}, {val: 14000, txt: "Senado - $14,000"}, {val: 16000, txt: "Lugareño - $16,000"},
    {val: 14000, txt: "Florida - $14,000"}, {val: 12000, txt: "Jimaguayu - $12,000"}, {val: 14000, txt: "Sibanicu - $14,000"},
    {val: 14000, txt: "Najasa - $14,000"}, {val: 12000, txt: "Vertientes - $12,000"}
];

function actualizarZonas() {
    let vehiculo = document.getElementById("vehiculo").value;
    let selectZona = document.getElementById("zona");
    selectZona.innerHTML = '<option value="0">Seleccionar destino...</option>';
    let lista = (vehiculo === "motorina") ? zonasMotorina : zonasCarrito;
    lista.forEach(z => {
        let opt = document.createElement("option");
        opt.value = z.val; opt.innerHTML = z.txt; selectZona.appendChild(opt);
    });
}

function calcular(){
    let total = parseInt(document.getElementById("zona").value);
    document.getElementById("precio").innerHTML = "Total: $" + total.toLocaleString();
    return total;
}

function enviar(){
    let total = calcular();
    let numPedido = (parseInt(localStorage.getItem('contador')) || 0) + 1;
    localStorage.setItem('contador', numPedido);

    let vehiculo = document.getElementById("vehiculo").value;
    let zonaTxt = document.getElementById("zona").options[document.getElementById("zona").selectedIndex].text;
    let agencia = (total >= 10000) ? 2000 : 50;
    
    let nuevoPedido = {
        id: numPedido, zona: zonaTxt, total: total, agencia: agencia,
        mensajero: total - agencia, fecha: new Date().toLocaleDateString()
    };

    let pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
    pedidos.push(nuevoPedido);
    localStorage.setItem('pedidos', JSON.stringify(pedidos));

    let msg = `*PEDIDO #${numPedido}*%0A*Vehículo:* ${vehiculo.toUpperCase()}%0A*Zona:* ${zonaTxt}%0A*Total:* $${total.toLocaleString()}%0A*Recogida:* ${document.getElementById("recoger").value} (${document.getElementById("hora").value})%0A*Entrega:* ${document.getElementById("entregar").value}%0A*Agencia:* $${agencia}%0A*Mensajero:* $${(total-agencia).toLocaleString()}%0A*Cliente:* ${document.getElementById("nombre").value} (${document.getElementById("telefono").value})`;
    window.open(`https://wa.me/5356746691?text=${msg}`, '_blank');
}

function accederAdmin() {
    let pass = prompt("Ingrese contraseña:");
    if(pass === "061021041122") {
        let pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
        let gananciaHoy = 0;
        let html = "<h2>Historial de Pedidos</h2><table border='1' width='100%'><tr><th>ID</th><th>Total</th><th>Agencia</th><th>Mensajero</th></tr>";
        pedidos.forEach(p => {
            html += `<tr><td>${p.id}</td><td>$${p.total}</td><td>$${p.agencia}</td><td>$${p.mensajero}</td></tr>`;
            gananciaHoy += p.agencia;
        });
        html += `</table><h3>Total Ganancia Acumulada: $${gananciaHoy}</h3><button onclick='localStorage.clear(); location.reload()'>Limpiar Datos</button>`;
        let ventana = window.open("", "_blank");
        ventana.document.write(html);
    } else { alert("Contraseña incorrecta"); }
}
actualizarZonas();
</script>
</body>
        </html>
