        button { background:#25D366; color:white; border:none; padding:15px; width:100%; margin-top:15px; font-size:17px; border-radius:10px; cursor:pointer; font-weight: bold; }

    </style>
</head>
<body>

    <div class="precio" id="precio">Total: $0</div>
    <input type="text" id="nombre" placeholder="Nombre">
    <textarea id="pedido" placeholder="¿Qué llevamos?"></textarea>
    
    <button onclick="enviar()">Enviar pedido por WhatsApp</button>
</div>

<script>
function calcular(){
    let total = parseInt(document.getElementById("zona").value);
    document.getElementById("precio").innerHTML = "Total: $" + total.toLocaleString();
    return total;
}

function enviar(){
    let total = calcular();
    let zonaTxt = document.getElementById("zona").options[document.getElementById("zona").selectedIndex].text;
    
    // Lógica de comisiones: 2000 para agencia en viajes largos, 50 en locales
    let agencia = (total >= 10000) ? 2000 : 50;
    let mensajero = total - agencia;

    let msg = `*NUEVO PEDIDO ENRUTA*%0A` +
              `*Zona:* ${zonaTxt}%0A` +
              `*Total:* $${total.toLocaleString()}%0A` +
              `*Ganancia Agencia:* $${agencia.toLocaleString()}%0A` +
              `*Pago Mensajero:* $${mensajero.toLocaleString()}%0A` +
              `*Cliente:* ${document.getElementById("nombre").value}%0A` +
              `*Pedido:* ${document.getElementById("pedido").value}`;

    window.open(`https://wa.me/5356746691?text=${msg}`, '_blank');
}
</script>
