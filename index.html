<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EnRuta Delivery</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(135deg,#1e90ff,#00c6ff);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
background:white;
width:95%;
max-width:500px;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.25);
text-align:center;
animation:fade 0.8s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.logo{
width:190px;
margin-bottom:10px;
}

h2{
margin:5px;
color:#333;
}

p{
color:#666;
margin-bottom:20px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:14px;
}

textarea{
resize:none;
}

button{
background:#25D366;
color:white;
border:none;
padding:15px;
width:100%;
margin-top:15px;
font-size:17px;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#1ebe5d;
transform:scale(1.03);
}

.precio{
font-size:22px;
color:#ff3b3b;
margin-top:10px;
font-weight:bold;
}

.oculto{
display:none;
}

</style>

</head>

<body>

<div class="container">

<img src="1772931732602.png" class="logo">

<h2>EnRuta Delivery</h2>
<p>Solicita tu domicilio rápido</p>

<select id="servicio" onchange="mostrarCampo()">
<option value="">Tipo de servicio</option>
<option value="paquete">Entrega de paquete</option>
<option value="cobro">Entrega con cobro</option>
</select>

<select id="zona" onchange="calcular()">

<option value="">Selecciona tu zona</option>

<option value="450">Centro del pueblo - $450</option>
<option value="650">Lenin - $650</option>
<option value="550">Modelo - $550</option>
<option value="500">La Caridad - $500</option>
<option value="550">La Vigía - $550</option>
<option value="550">Florat - $550</option>
<option value="500">Vista Hermosa - $500</option>
<option value="550">Versalles - $550</option>
<option value="500">Agramonte - $500</option>
<option value="650">Jayama - $650</option>

<option value="550">Monte Carlos - $550</option>
<option value="550">La Mosca - $550</option>
<option value="550">Marquesado - $550</option>
<option value="600">La Esperanza - $600</option>
<option value="600">Nueva Esperanza - $600</option>
<option value="550">Garrido - $550</option>
<option value="600">El Micro - $600</option>
<option value="550">Palomino - $550</option>

<option value="12000">Minas - $12000</option>
<option value="14000">Senado - $14000</option>
<option value="14000">Florida - $14000</option>
<option value="12000">Jimaguayu - $12000</option>
<option value="14000">Sibanicu - $14000</option>
<option value="14000">Najasa - $14000</option>
<option value="12000">Vertientes - $12000</option>
<option value="16000">Lugareño - $16000</option>

</select>

<div class="precio" id="precio">Precio: $0</div>

<input type="text" id="nombre" placeholder="Nombre">
<input type="text" id="telefono" placeholder="Teléfono">

<input type="text" id="recoger" placeholder="Dirección de recogida">
<input type="text" id="entregar" placeholder="Dirección de entrega">

<textarea id="pedido" placeholder="Qué se va a enviar"></textarea>

<input type="text" id="importe" placeholder="Importe del viaje">

<input type="text" id="cobro" class="oculto" placeholder="Monto a cobrar al cliente">

<button onclick="enviar()">Enviar pedido por WhatsApp</button>

</div>

<script>

function calcular(){
var zona=document.getElementById("zona").value;
document.getElementById("precio").innerHTML="Precio: $"+zona;
}

function mostrarCampo(){

var servicio=document.getElementById("servicio").value;

if(servicio=="cobro"){
document.getElementById("cobro").style.display="block";
}else{
document.getElementById("cobro").style.display="none";
}

}
