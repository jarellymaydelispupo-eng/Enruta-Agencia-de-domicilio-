<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnRuta Delivery</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#00b4db,#0083b0);
margin:0;
padding:20px;
}

.container{
background:white;
max-width:500px;
margin:auto;
padding:20px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.logo{
width:150px;
display:block;
margin:auto;
}

h1{
text-align:center;
}

.sub{
text-align:center;
color:#666;
margin-bottom:20px;
}

select,input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.precio{
text-align:center;
font-size:24px;
color:red;
font-weight:bold;
margin:15px 0;
}

button{
width:100%;
padding:15px;
background:#25D366;
border:none;
border-radius:12px;
font-size:18px;
color:white;
margin-top:15px;
}

</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>EnRuta Delivery</h1>
<div class="sub">Solicita tu domicilio rápido</div>

<select id="transporte" onchange="actualizar()">
<option value="motorina">🛵 Motorina</option>
<option value="carrito">🚗 Carrito eléctrico</option>
</select>

<select id="servicio" onchange="actualizar()">
<option value="simple">Entrega simple</option>
<option value="cobro">Entrega con cobro</option>
</select>

<select id="zona" onchange="actualizar()">

<option value="450">Centro del pueblo</option>
<option value="650">Lenin</option>
<option value="550">Modelo</option>
<option value="500">La Caridad</option>
<option value="550">La Vigía</option>
<option value="550">Florat</option>
<option value="500">Vista Hermosa</option>
<option value="550">Versalles</option>
<option value="500">Agramonte</option>
<option value="650">Jayama</option>
<option value="550">Monte Carlos</option>
<option value="550">La Mosca</option>
<option value="550">Marquesado</option>
<option value="600">La Esperanza</option>
<option value="600">Nueva Esperanza</option>
<option value="550">Garrido</option>
<option value="600">El Micro</option>

<option disabled>──── VIAJES LARGOS ────</option>

<option value="12000">Minas</option>
<option value="14000">Senado</option>
<option value="14000">Florida</option>
<option value="12000">Jimaguayu</option>
<option value="14000">Sibanicu</option>
<option value="14000">Najasa</option>
<option value="12000">Vertientes</option>
<option value="16000">Lugareño</option>

</select>

<div class="precio" id="precio">
Precio: $450
</div>

<input type="text" id="nombre" placeholder="Nombre">
<input type="text" id="telefono" placeholder="Teléfono">
<input type="text" id="recogida" placeholder="Dirección de recogida">
<input type="text" id="entrega" placeholder="Dirección de entrega">

<textarea id="producto" placeholder="Qué se va a enviar"></textarea>

<div id="cobroCampo" style="display:none;">
<input type="number" id="cobro" placeholder="Monto a cobrar al cliente">
</div>

<button onclick="enviar()">Enviar pedido por WhatsApp</button>

</div>

<script>

function actualizar(){

let base=parseInt(document.getElementById("zona").value)
let transporte=document.getElementById("transporte").value
let servicio=document.getElementById("servicio").value

let precio=base

if(transporte=="carrito"){
precio=base+100
}

document.getElementById("precio").innerHTML="Precio: $"+precio

if(servicio=="cobro"){
document.getElementById("cobroCampo").style.display="block"
}else{
document.getElementById("cobroCampo").style.display="none"
}

}

function enviar(){

let transporte=document.getElementById("transporte").value
let nombre=document.getElementById("nombre").value
let telefono=document.getElementById("telefono").value
let recogida=document.getElementById("recogida").value
let entrega=document.getElementById("entrega").value
let producto=document.getElementById("producto").value
let zona=document.getElementById("zona")
let base=parseInt(zona.value)

let precio=base

if(transporte=="carrito"){
precio=base+100
}

let zonaTexto=zona.options[zona.selectedIndex].text
let servicio=document.getElementById("servicio").value
let cobro=document.getElementById("cobro").value

let texto="Hola EnRuta deseo un domicilio%0A%0A"

texto+="Transporte: "+transporte+"%0A"
texto+="Nombre: "+nombre+"%0A"
texto+="Teléfono: "+telefono+"%0A"
texto+="Zona: "+zonaTexto+"%0A"
texto+="Recoger en: "+recogida+"%0A"
texto+="Entregar en: "+entrega+"%0A"
texto+="Producto: "+producto+"%0A"
texto+="Importe del viaje: $"+precio+"%0A"

if(servicio=="cobro"){
texto+="Monto a cobrar al cliente: $"+cobro+"%0A"
}

window.open("https://wa.me/5356746691?text="+texto)

}

actualizar()

</script>

</body>
  </html>
