<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnRuta Delivery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
        body { font-family: 'Poppins', sans-serif; background:#f4f7f6; padding: 20px; display:flex; justify-content:center; }
        .container { background:white; width:100%; max-width:450px; padding:30px; border-radius:25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 25px; }
        .header img { width: 220px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
        select, input, textarea { width:100%; padding:14px; border: 2px solid #eee; border-radius:12px; font-size:15px; box-sizing: border-box; }
        .precio-box { background: #e8f4ff; color: #1e90ff; padding: 15px; border-radius: 12px; text-align: center; font-size: 20px; font-weight: 700; margin: 20px 0; }
        button { background: linear-gradient(45deg, #1e90ff, #00c6ff); color:white; border:none; padding:18px; width:100%; font-size:17px; border-radius:12px; cursor:pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="1772931732602.png" alt="Logo">
        <h2>EnRuta Delivery</h2>
    </div>

    <div class="form-group">
        <label>Vehículo</label>
        <select id="vehiculo" onchange="actualizarZonas()">
            <option value="motorina">Motorina (Zonas Cercanas)</option>
            <option value="carrito">Carrito Eléctrico (Viajes largos)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Zona de entrega</label>
        <select id="zona" onchange="calcular()">
            <option value="0">Seleccionar destino...</option>
        </select>
    </div>

    <div class="precio-box" id="precio">Total: $0</div>

    <div class="form-group">
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="tel" id="telefono" placeholder="Teléfono" style="margin-top:10px;">
        <input type="text" id="recoger" placeholder="Dirección de recogida" style="margin-top:10px;">
        <input type="text" id="entregar" placeholder="Dirección de entrega" style="margin-top:10px;">
        
        <label style="margin-top:15px;">Horario de recogida</label>
        <input type="time" id="hora">
        
        <textarea id="pedido" placeholder="¿Qué vamos a enviar?" rows="2" style="margin-top:10px;"></textarea>
    </div>

    <button onclick="enviar()">Solicitar Envío</button>
    
    <div style="margin-top: 30px; text-align: center;">
        <button onclick="accederAdmin()" style="background:#555; color:white; padding:10px; font-size:12px; border:none; border-radius:8px;">Panel Admin</button>
    </div>
</div>

<script>
const zonasMotorina = [
    {val: 350, txt: "Centro del pueblo - $350"}, {val: 400, txt: "La Caridad - $400"}, {val: 450, txt: "Modelo - $450"},
    {val: 450, txt: "La Vigía - $450"}, {val: 450, txt: "Florat - $450"}, {val: 400, txt: "Vista Hermosa - $400"},
    {val: 450, txt: "Versalles - $450"}, {val: 400, txt: "Agramonte - $400"}, {val: 550, txt: "Jayama - $550"},
    {val: 450, txt: "Monte Carlos - $450"}, {val: 450, txt: "La Mosca - $450"}, {val: 450, txt: "Marquesado - $450"},
    {val: 500, txt: "La Esperanza - $500"}, {val: 500, txt: "Nueva Esperanza - $500"}, {val: 450, txt: "Garrido - $450"},
    {val: 500, txt: "El Micro - $500"}, {val: 450, txt: "Palomino - $450"}, {val: 450, txt: "Juanito - $450"},
    {val: 400, txt: "Previsora - $400"}, {val: 500, txt: "La Guernina - $500"}, {val: 500, txt: "La Belén - $500"},
    {val: 400, txt: "Casino Campestre - $400"}, {val: 400, txt: "Las Mercedes - $400"}, {val: 400, txt: "Simoni - $400"},
    {val: 450, txt: "Montejo - $450"}, {val: 500, txt: "La Yaba - $500"}, {val: 500, txt: "Nadales - $500"},
    {val: 450, txt: "Bella Vista - $450"}, {val: 500, txt: "Vista Bella - $500"}, {val: 450, txt: "Inra - $450"},
    {val: 500, txt: "Imán - $500"}, {val: 450, txt: "Mascota - $450"}, {val: 450, txt: "Puerto Príncipe - $450"},
    {val: 550, txt: "Isabel Hortensia - $550"}, {val: 450, txt: "Villa Mariana - $450"}, {val: 500, txt: "Los Coquitos - $500"},
    {val: 500, txt: "La Zambrana - $500"}, {val: 550, txt: "Saratoga - $550"}, {val: 450, txt: "El Jardín - $450"},
    {val: 400, txt: "Floiran Quiroz - $400"}, {val: 400, txt: "Porvenir - $400"}, {val: 500, txt: "Nitrógeno - $500"},
    {val: 450, txt: "Buenos Aires - $450"}, {val: 450, txt: "Camino de la Matanza - $450"}, {val: 400, txt: "Sanchez Soto - $400"},
    {val: 5050, txt: "Florida - $5,050"}, {val: 5550, txt: "Vertientes - $5,550"}, {val: 4550, txt: "Jimaguayu - $4,550"}
];

const zonasCarrito = [
    {val: 12000, txt: "Minas - $12,000"}, {val: 14000, txt: "Senado - $14,000"}, {val: 16000, txt: "Lugareño - $16,000"}
];

function actualizarZonas() {
    let vehiculo = document.getElementById("vehiculo").value;
    let selectZona = document.getElementById("zona");
    selectZona.innerHTML = '<option value="0">Seleccionar destino...</option>';
    let lista = (vehiculo === "motorina") ? zonasMotorina : zonasCarrito;
    lista.forEach(z => {
        let opt = document.createElement("option");
        opt.value = z.val; opt.innerHTML = z.txt; selectZona.appendChild(opt);
    });
}

function calcular(){
    let total = parseInt(document.getElementById("zona").value) || 0;
    document.getElementById("precio").innerHTML = "Total: $" + total.toLocaleString();
    return total;
}

function enviar(){
    let total = calcular();
    if(total === 0) { alert("Por favor selecciona una zona"); return; }
    
    let numPedido = (parseInt(localStorage.getItem('contador')) || 0) + 1;
    localStorage.setItem('contador', numPedido);

    // Lógica financiera: Agencia base + $500 adicionales extraídos del mensajero
    let agenciaBase = (total >= 10000) ? 2000 : 50;
    let agenciaFinal = agenciaBase + 500;
    let mensajeroFinal = total - agenciaFinal;

    let nuevoPedido = { 
        id: numPedido, 
        nombre: document.getElementById("nombre").value,
        telefono: document.getElementById("telefono").value,
        zona: document.getElementById("zona").options[document.getElementById("zona").selectedIndex].text,
        recoger: document.getElementById("recoger").value,
        entregar: document.getElementById("entregar").value,
        hora: document.getElementById("hora").value,
        pedido: document.getElementById("pedido").value,
        total: total, 
        agencia: agenciaFinal, 
        mensajero: mensajeroFinal 
    };

    let pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
    pedidos.push(nuevoPedido);
    localStorage.setItem('pedidos', JSON.stringify(pedidos));

    let msg = `*PEDIDO #${numPedido}*%0A*Nombre:* ${nuevoPedido.nombre}%0A*Zona:* ${nuevoPedido.zona}%0A*Total:* $${total.toLocaleString()}%0A*Recogida:* ${nuevoPedido.recoger} (${nuevoPedido.hora})%0A*Entrega:* ${nuevoPedido.entregar}%0A*Detalle:* ${nuevoPedido.pedido}%0A---%0A*Agencia:* $${agenciaFinal}%0A*Mensajero:* $${mensajeroFinal.toLocaleString()}`;
    window.location.href = `https://wa.me/5356746691?text=${msg}`;
}

function accederAdmin() {
    let pass = prompt("Ingrese contraseña:");
    if(pass === "061021041122") {
        let pedidos = JSON.parse(localStorage.getItem('pedidos') || '[]');
        let gananciaTotal = 0;
        let html = `<h2>Historial de Pedidos</h2><table border='1' width='100%' style='border-collapse:collapse; font-size:12px;'>
            <tr><th>ID</th><th>Cliente</th><th>Teléfono</th><th>Zona</th><th>Recogida</th><th>Hora</th><th>Entrega</th><th>Detalle</th><th>Total</th><th>Agencia</th><th>Mensajero</th></tr>`;
        pedidos.forEach(p => {
            html += `<tr><td>${p.id}</td><td>${p.nombre}</td><td>${p.telefono}</td><td>${p.zona}</td><td>${p.recoger}</td><td>${p.hora}</td><td>${p.entregar}</td><td>${p.pedido}</td><td>$${p.total}</td><td>$${p.agencia}</td><td>$${p.mensajero}</td></tr>`;
            gananciaTotal += p.agencia;
        });
        html += `</table><h3>Total Ganancia: $${gananciaTotal}</h3><button onclick='localStorage.clear(); location.reload()'>Borrar todo</button>`;
        let ventana = window.open("", "_blank");
        ventana.document.write(html);
    } else { alert("Contraseña incorrecta"); }
}
actualizarZonas();
</script>
</body>
            </html>
